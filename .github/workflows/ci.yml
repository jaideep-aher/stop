name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      WHOSTOP_FORBID_REMOTE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check whostop tests site/build_pages_artifact.py
      - name: Test
        run: pytest
      - name: Pages artifact contains only allowlisted images
        run: python site/build_pages_artifact.py --out _pages --check
      - name: Regenerated metrics match the commit
        run: make reproduce
