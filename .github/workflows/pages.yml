# Disabled. GitHub Pages is not enabled, and this repository is private, so the
# configure-pages step fails. The public site is hosted separately. The image
# allowlist is still enforced by the tests workflow
# (site/build_pages_artifact.py --check). Do not re-enable this deploy until
# Pages is turned on for a public repository.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub Pages deploy is disabled. The public site is hosted separately."
